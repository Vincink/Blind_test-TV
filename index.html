<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/jpeg" href="icon.jpeg">
    <link rel="apple-touch-icon" href="icon.jpeg">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blind Test - Admin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .burger-container {
            position: relative;
        }

        .burger-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .burger-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .burger-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background: white;
            border-radius: 2px;
        }

        .burger-menu {
            position: absolute;
            right: 0;
            top: 55px;
            background: #151b2b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            width: 320px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        .burger-menu.open {
            display: flex;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item label {
            font-size: 0.9rem;
            color: #a0aec0;
            font-weight: 500;
        }

        .menu-search-input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }

        .score-target-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .target-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .target-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        .target-btn.active {
            background: #7928ca;
            border-color: #ff007f;
            box-shadow: 0 0 10px rgba(121, 40, 202, 0.5);
        }

        .target-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .favorites-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
            padding: 2px;
        }

        .fav-pill {
            background: rgba(121, 40, 202, 0.25);
            border: 1px solid rgba(121, 40, 202, 0.5);
            color: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }

        .fav-pill:hover {
            background: rgba(121, 40, 202, 0.6);
        }

        .fav-pill .delete-fav {
            font-size: 0.7rem;
            color: #ff6b6b;
            cursor: pointer;
            margin-left: 4px;
        }

        .custom-playlists-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .custom-playlist-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .custom-playlist-info {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            flex: 1;
        }

        .custom-playlist-name {
            font-weight: 600;
            color: #fff;
        }

        .custom-playlist-count {
            font-size: 0.75rem;
            color: #a0aec0;
        }

        .custom-playlist-actions {
            display: flex;
            gap: 6px;
        }

        .mini-icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .mini-icon-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .mini-icon-btn.danger:hover {
            background: rgba(225, 62, 62, 0.4);
            color: #ff6b6b;
        }

        .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 5px 0;
        }

        .menu-action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .menu-action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .menu-action-btn.danger {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.3);
        }

        .menu-action-btn.danger:hover {
            background: rgba(255, 107, 107, 0.15);
        }

        /* Modales */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #custom-modal {
            z-index: 2000;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #151b2b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 30px;
            width: 420px;
            max-width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .modal-card.wide-editor {
            width: 90vw;
            max-width: 1150px;
            height: 88vh;
            max-height: 850px;
        }

        .modal-overlay.open .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .modal-message {
            font-size: 0.95rem;
            color: #a0aec0;
            line-height: 1.4;
        }

        .modal-input {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 5px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transition: background 0.2s;
        }

        .modal-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .modal-btn.primary {
            background: #7928ca;
            border-color: #ff007f;
        }

        .modal-btn.primary:hover {
            background: #8e35e6;
        }

        .modal-btn.danger {
            background: #e53e3e;
            border-color: #f56565;
        }

        .modal-btn.danger:hover {
            background: #f56565;
        }

        .editor-container-flex {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            flex: 1;
            overflow: hidden;
            text-align: left;
        }

        .editor-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 20px;
            overflow: hidden;
        }

        .editor-column label {
            font-size: 1rem;
            color: #a0aec0;
            font-weight: 600;
        }

        .editor-tracks-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 6px;
        }

        .editor-track-row {
            background: rgba(25, 30, 45, 0.95);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.95rem;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .editor-track-art {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.25);
        }

        .editor-track-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            overflow: hidden;
        }

        .editor-track-name {
            font-weight: 700;
            color: #fff;
            word-break: break-word;
            line-height: 1.25;
        }

        .editor-track-artist {
            font-size: 0.85rem;
            color: #cbd5e1;
            word-break: break-word;
        }

        .editor-track-album {
            font-size: 0.75rem;
            color: #a78bfa;
            word-break: break-word;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
        }

        .editor-track-album:hover {
            color: #c084fc;
            text-decoration: underline;
        }

        .editor-search-results {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 6px;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .search-input-wrapper input {
            padding: 10px 36px 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        .clear-search-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px;
            display: none;
        }

        .clear-search-btn:hover {
            color: #fff;
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr 450px;
            padding: 30px;
            gap: 30px;
            position: relative;
            overflow: hidden;
        }

        .left-zone {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .left-zone.minimized {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 180px;
            height: 180px;
            padding: 10px;
            z-index: 10;
            background: rgba(11, 15, 25, 0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .left-zone.minimized .qr-title,
        .left-zone.minimized .qr-instructions,
        .left-zone.minimized .itunes-search-box {
            display: none;
        }

        .left-zone.minimized .qr-box {
            width: 120px;
            height: 120px;
        }

        .qr-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .qr-box {
            width: 160px;
            height: 160px;
            background: white;
            padding: 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
        }

        .itunes-search-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }

        .itunes-search-box input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .center-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .reveal-container {
            display: none;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            padding: 18px 25px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            z-index: 10;
            width: 90%;
            max-width: 360px;
        }

        .reveal-container.visible {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: revealPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .reveal-label {
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ff007f;
            font-weight: 800;
            margin-bottom: 6px;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }

        .track-info-preview {
            font-size: 1.4rem;
            color: #ffffff;
            font-weight: 800;
            text-align: center;
            text-shadow: 0 2px 20px rgba(121, 40, 202, 0.7);
        }

        @keyframes revealPop {
            0% { opacity: 0; transform: translateX(-50%) scale(0.85); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        .vinyl-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #111 0%, #111 30%, #222 31%, #000 100%);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: spin 8s linear infinite paused;
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        .vinyl-label {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.65rem;
            border: 3px solid #fff;
            text-align: center;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .game-status-display {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .status-title {
            font-size: 1.2rem;
            color: #a0aec0;
            margin-bottom: 5px;
        }

        .counter-wrapper {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px 0;
        }

        .big-counter {
            font-size: 3.8rem;
            font-weight: 800;
            color: #ff007f;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            line-height: 1;
        }

        .right-zone {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: calc(100vh - 120px);
            position: relative;
            overflow: hidden;
        }

        .right-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .right-header-bar h2 {
            font-size: 1.05rem;
        }

        .players-count {
            background: #7928ca;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .bottom-action-btn {
            position: absolute;
            bottom: 30px;
            right: 80px;
            background: #22c55e;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
            transition: transform 0.1s, background 0.2s, opacity 0.2s;
            z-index: 20;
        }

        .bottom-action-btn.playing-state {
            background: #7928ca;
            box-shadow: 0 10px 25px rgba(121, 40, 202, 0.4);
        }

        .bottom-action-btn:hover:not(:disabled) {
            transform: scale(1.03);
        }

        .bottom-action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .players-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            padding-bottom: 70px;
        }

        .top-three-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .scrollable-players-wrapper {
            flex: 1;
            overflow: hidden;
            position: relative;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
            padding-top: 10px;
        }

        .scrollable-players-inner {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: absolute;
            width: 100%;
            animation: smoothMarquee 12s ease-in-out infinite alternate;
        }

        @keyframes smoothMarquee {
            0% { transform: translateY(0); }
            100% { transform: translateY(calc(-100% + 150px)); }
        }

        .player-row-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            flex-shrink: 0;
        }

        .player-delete-action {
            position: absolute;
            right: -80px;
            top: 0;
            bottom: 0;
            width: 80px;
            background: #e53e3e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            border-top-right-radius: 14px;
            border-bottom-right-radius: 14px;
            transition: right 0.2s ease;
            z-index: 1;
        }

        .player-row-wrapper.swiped .player-delete-action {
            right: 0;
        }

        .player-pill {
            position: relative;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-radius: 14px;
            background: rgba(25, 30, 45, 0.9);
            transition: transform 0.2s ease;
            border: 2.5px solid var(--player-color);
            box-shadow: 0 0 15px 2px var(--player-glow);
            z-index: 2;
            touch-action: pan-y;
        }

        .player-pill.swiped {
            transform: translateX(-80px);
        }

        .player-rank {
            font-weight: 800;
            font-size: 1.1rem;
            width: 30px;
            color: #ffffff;
        }

        .player-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            margin-right: 15px;
            border: 2px solid white;
        }

        .player-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-weight: 600;
            font-size: 1rem;
            color: #ffffff;
        }

        .points-badge {
            background: rgba(0, 0, 0, 0.85);
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.95rem;
            border: 2px solid var(--player-color);
            color: var(--player-color);
            box-shadow: 0 0 12px var(--player-color);
            margin-right: 12px;
            opacity: 1;
            transition: opacity 0.5s ease;
            z-index: 5;
        }

        .points-badge.penalty {
            border-color: #ef4444;
            color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
        }

        .points-badge.fade-out {
            opacity: 0;
        }

        .player-score {
            font-weight: 800;
            font-size: 1.1rem;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        const firebaseConfig = {

            authDomain: "blindtest-tv.firebaseapp.com",
            databaseURL: "https://blindtest-tv-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "blindtest-tv",
            storageBucket: "blindtest-tv.firebasestorage.app",
            messagingSenderId: "879373587888",
            appId: "1:879373587888:web:df8c99cb8aed5b7acb7275",
            measurementId: "G-J090BQQYZB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.dbInstance = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbUpdate = update;
        window.dbGet = get;
        window.dbRemove = remove;

        window.winningScore = 150;
        window.gameOverTriggered = false;

        document.addEventListener('click', (e) => {
            const burgerContainer = document.querySelector('.burger-container');
            const burgerMenu = document.getElementById('burger-dropdown');
            if (burgerMenu && burgerMenu.classList.contains('open')) {
                if (!burgerContainer.contains(e.target)) {
                    burgerMenu.classList.remove('open');
                }
            }
        });

        window.playClickSound = function() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        };

        window.toggleBurgerMenu = function() {
            const dropdown = document.getElementById('burger-dropdown');
            dropdown.classList.toggle('open');
            if (dropdown.classList.contains('open')) {
                const mainInput = document.getElementById('itunes-query');
                const burgerInput = document.getElementById('burger-search-input');
                if (mainInput && burgerInput) burgerInput.value = mainInput.value;
            }
        };

        window.showModal = function(title, message, type, onConfirm) {
            const overlay = document.getElementById('custom-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').innerHTML = message;
            
            const btnContainer = document.getElementById('modal-buttons');
            btnContainer.innerHTML = '';

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'modal-btn';
            cancelBtn.textContent = "Annuler";
            cancelBtn.onclick = () => { playClickSound(); overlay.classList.remove('open'); };
            btnContainer.appendChild(cancelBtn);

            const confirmBtn = document.createElement('button');
            confirmBtn.className = `modal-btn ${type === 'danger' ? 'danger' : 'primary'}`;
            confirmBtn.textContent = "Confirmer";
            confirmBtn.onclick = () => {
                playClickSound();
                overlay.classList.remove('open');
                if (onConfirm) onConfirm();
            };
            btnContainer.appendChild(confirmBtn);

            overlay.classList.add('open');
        };

        window.showAlertModal = function(title, message) {
            const overlay = document.getElementById('custom-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').innerHTML = message;
            
            const btnContainer = document.getElementById('modal-buttons');
            btnContainer.innerHTML = '';

            const okBtn = document.createElement('button');
            okBtn.className = 'modal-btn primary';
            okBtn.textContent = "OK";
            okBtn.onclick = () => { playClickSound(); overlay.classList.remove('open'); };
            btnContainer.appendChild(okBtn);

            overlay.classList.add('open');
        };

        window.setTargetScore = function(score) {
            if (window.gameHasStarted || window.roundActiveLoop) return;
            window.winningScore = score;
            [150, 200, 250, 300].forEach(val => {
                const btn = document.getElementById(`btn-${val}`);
                if (val === score) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        };

        window.updateTargetScoreUI = function() {
            const disable = window.gameHasStarted || window.roundActiveLoop;
            [150, 200, 250, 300].forEach(val => {
                const btn = document.getElementById(`btn-${val}`);
                if (btn) btn.disabled = disable;
            });
        };

        window.confirmResetScores = function() {
            window.showModal("Remettre les scores à zéro", "Voulez-vous remettre tous les scores à 0 ?", "primary", () => {
                if (window.dbInstance && window.dbRef && window.dbGet && window.dbUpdate) {
                    window.dbGet(window.dbRef(window.dbInstance, 'players')).then((snapshot) => {
                        const players = snapshot.val();
                        if (players) {
                            Object.keys(players).forEach(playerId => {
                                window.dbUpdate(window.dbRef(window.dbInstance, 'players/' + playerId), {
                                    score: 0,
                                    answered: false,
                                    lastChoice: null,
                                    lastEarnedPoints: 0
                                });
                            });
                        }
                    });
                }
            });
        };

        window.confirmStopGame = function() {
            window.showModal("Arrêter la partie", "Voulez-vous vraiment arrêter la partie en cours ?", "danger", () => {
                const audioElem = document.getElementById('audio-player');
                if (audioElem) audioElem.pause();
                const previewElem = document.getElementById('preview-audio-player');
                if (previewElem) previewElem.pause();
                document.getElementById('vinyl-disc').classList.remove('playing');
                
                window.roundActiveLoop = false;
                window.gameHasStarted = false;
                window.gameOverTriggered = false;
                window.updateTargetScoreUI();

                document.getElementById('qr-container').classList.remove('minimized');
                document.getElementById('status-label').textContent = "Charge les morceaux puis clique sur Démarrer";
                document.getElementById('big-counter').textContent = "--";
                document.getElementById('reveal-container-box').classList.remove('visible');
                document.getElementById('reveal-label').textContent = "";
                document.getElementById('track-info-preview').textContent = "";
                
                const startBtn = document.getElementById('start-btn');
                document.getElementById('start-btn-text').textContent = "Démarrer la partie";
                startBtn.disabled = false;
                startBtn.classList.remove('playing-state');
                startBtn.onclick = () => { playClickSound(); startNextRound(); };

                if (window.dbInstance && window.dbRef && window.dbGet && window.dbUpdate) {
                    window.dbGet(window.dbRef(window.dbInstance, 'players')).then((snapshot) => {
                        const players = snapshot.val();
                        if (players) {
                            Object.keys(players).forEach(playerId => {
                                window.dbUpdate(window.dbRef(window.dbInstance, 'players/' + playerId), {
                                    score: 0,
                                    answered: false,
                                    lastChoice: null,
                                    lastEarnedPoints: 0
                                });
                            });
                        }
                    });
                    window.dbSet(window.dbRef(window.dbInstance, 'gameState'), { status: 'stopped' });
                }
            });
        };

        window.confirmRemoveAllPlayers = function() {
            window.showModal("Suppression des joueurs", "Voulez-vous vraiment supprimer TOUS les joueurs ?", "danger", () => {
                remove(ref(db, 'players'));
            });
        };

        const mobileUrl = "https://vincink.github.io/Blind_test-TV/mobile.html"; 
        document.getElementById('qr-code-box').innerHTML = `
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(mobileUrl)}" alt="QR Code Mobile">
        `;

        const playersRef = ref(db, 'players');
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val();
            const topContainer = document.getElementById('top-three-container');
            const scrollWrapper = document.getElementById('scroll-wrapper');
            const scrollableContainer = document.getElementById('scrollable-container');
            
            topContainer.innerHTML = '';
            scrollableContainer.innerHTML = '';

            if (!data) {
                document.getElementById('player-count').textContent = '0';
                topContainer.innerHTML = '<div style="color: #a0aec0; text-align: center; margin-top: 20px;">En attente de joueurs</div>';
                scrollWrapper.style.display = 'none';
                return;
            }

            let playersArray = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            }));

            playersArray.sort((a, b) => (b.score || 0) - (a.score || 0));
            document.getElementById('player-count').textContent = playersArray.length;

            const topThree = playersArray.slice(0, 3);
            const restOfPlayers = playersArray.slice(3);

            const createPlayerHTML = (player, index) => {
                const pColor = player.color || '#7928ca';
                let glowColor = 'rgba(121, 40, 202, 0.85)';
                if (pColor.startsWith('#') && pColor.length === 7) {
                    let r = parseInt(pColor.slice(1, 3), 16);
                    let g = parseInt(pColor.slice(3, 5), 16);
                    let b = parseInt(pColor.slice(5, 7), 16);
                    glowColor = `rgba(${r}, ${g}, ${b}, 0.85)`;
                }

                let pointsBadgeHTML = '';
                if (player.lastEarnedPoints !== undefined && player.lastEarnedPoints !== null && player.lastEarnedPoints !== 0) {
                    if (player.lastEarnedPoints > 0) {
                        pointsBadgeHTML = `<div class="points-badge">+${player.lastEarnedPoints}</div>`;
                    } else {
                        pointsBadgeHTML = `<div class="points-badge penalty">${player.lastEarnedPoints}</div>`;
                    }
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'player-row-wrapper';
                wrapper.innerHTML = `
                    <div class="player-delete-action" onclick="playClickSound(); confirmRemovePlayer('${player.id}')">
                        <i class="fa-solid fa-trash"></i>
                    </div>
                    <div class="player-pill" id="pill-${player.id}" style="--player-color: ${pColor}; --player-glow: ${glowColor};">
                        <div class="player-rank">#${index + 1}</div>
                        <div class="player-avatar" style="background-image: url('${player.avatar || "https://i.pravatar.cc/150?img=1"}')"></div>
                        <div class="player-info">
                            <span class="player-name">${player.name}</span>
                            <div style="display: flex; align-items: center;">
                                ${pointsBadgeHTML}
                                <span class="player-score" style="color: ${pColor}">${player.score || 0} pts</span>
                            </div>
                        </div>
                    </div>
                `;

                const pill = wrapper.querySelector('.player-pill');
                let startX = 0;
                pill.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
                pill.addEventListener('touchmove', (e) => {
                    let moveX = e.touches[0].clientX;
                    let diff = moveX - startX;
                    if (diff < -20) {
                        wrapper.classList.add('swiped');
                        pill.classList.add('swiped');
                    } else if (diff > 20) {
                        wrapper.classList.remove('swiped');
                        pill.classList.remove('swiped');
                    }
                });

                return wrapper;
            };

            topThree.forEach((player, index) => {
                topContainer.appendChild(createPlayerHTML(player, index));
            });

            if (restOfPlayers.length > 0) {
                scrollWrapper.style.display = 'block';
                restOfPlayers.forEach((player, index) => {
                    scrollableContainer.appendChild(createPlayerHTML(player, index + 3));
                });
            } else {
                scrollWrapper.style.display = 'none';
            }
        });

        window.confirmRemovePlayer = function(id) {
            window.showModal("Suppression", "Voulez-vous supprimer ce joueur de la partie ?", "danger", () => {
                remove(ref(db, 'players/' + id));
            });
        };
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        let dynamicPlaylist = [];
        let playedIndices = [];
        let roundActive = false;
        window.roundActiveLoop = false;
        window.gameHasStarted = false;
        let musicTimeLeft = 15;
        let pendingVictory = false;
        let activeEditingPlaylistId = null;
        let editorSearchResultsCache = [];

        // Gestion du mode audio (tv ou ipad)
        let audioMode = localStorage.getItem('blindtest_audio_mode') || 'tv';

        window.setAudioMode = function(mode) {
            audioMode = mode;
            localStorage.setItem('blindtest_audio_mode', mode);
            if (mode === 'tv') {
                document.getElementById('btn-audio-tv').classList.add('active');
                document.getElementById('btn-audio-ipad').classList.remove('active');
            } else {
                document.getElementById('btn-audio-ipad').classList.add('active');
                document.getElementById('btn-audio-tv').classList.remove('active');
            }
        };

        const defaultFavorites = ["variete francaise", "annees 80", "rock", "disney", "hits 2024"];
        
        function getFavorites() {
            let saved = localStorage.getItem('blindtest_favs');
            return saved ? JSON.parse(saved) : defaultFavorites;
        }

        function saveFavorites(favs) {
            localStorage.setItem('blindtest_favs', JSON.stringify(favs));
            renderFavorites();
        }

        window.renderFavorites = function() {
            const container = document.getElementById('favorites-list');
            if (!container) return;
            const favs = getFavorites();
            container.innerHTML = '';

            favs.forEach(fav => {
                const pill = document.createElement('div');
                pill.className = 'fav-pill';

                const textSpan = document.createElement('span');
                textSpan.textContent = fav;
                textSpan.style.cursor = 'pointer';
                textSpan.onclick = () => { playClickSound(); selectFavorite(fav); };

                const deleteSpan = document.createElement('span');
                deleteSpan.className = 'delete-fav';
                deleteSpan.textContent = '✕';
                deleteSpan.title = 'Supprimer';
                deleteSpan.onclick = (e) => {
                    e.stopPropagation();
                    playClickSound();
                    removeFavorite(fav);
                };

                pill.appendChild(textSpan);
                pill.appendChild(deleteSpan);
                container.appendChild(pill);
            });
        };

        window.selectFavorite = function(query) {
            document.getElementById('itunes-query').value = query;
            document.getElementById('burger-search-input').value = query;
            fetchItunesPlaylist();
            toggleBurgerMenu();
        };

        window.searchFromBurger = function() {
            const query = document.getElementById('burger-search-input').value.trim();
            if (!query) return;
            document.getElementById('itunes-query').value = query;
            fetchItunesPlaylist();
            toggleBurgerMenu();
        };

        window.addCurrentQueryToFavorites = function() {
            const query = document.getElementById('burger-search-input').value.trim() || document.getElementById('itunes-query').value.trim();
            if (!query) return;
            let favs = getFavorites();
            if (!favs.includes(query)) {
                favs.push(query);
                saveFavorites(favs);
                window.showAlertModal("Succès", `"${query}" a été ajouté à vos favoris.`);
            } else {
                window.showAlertModal("Information", "Cette recherche est déjà dans vos favoris.");
            }
        };

        window.removeFavorite = function(fav) {
            let favs = getFavorites();
            favs = favs.filter(f => f !== fav);
            saveFavorites(favs);
        };

        function getCustomPlaylists() {
            let saved = localStorage.getItem('blindtest_custom_playlists');
            return saved ? JSON.parse(saved) : [];
        }

        function saveCustomPlaylists(playlists) {
            localStorage.setItem('blindtest_custom_playlists', JSON.stringify(playlists));
            renderCustomPlaylists();
        }

        window.renderCustomPlaylists = function() {
            const container = document.getElementById('custom-playlists-list');
            if (!container) return;
            const playlists = getCustomPlaylists();
            container.innerHTML = '';

            if (playlists.length === 0) {
                container.innerHTML = '<div style="color: #a0aec0; font-size: 0.8rem; text-align: center; padding: 5px;">Aucune playlist perso</div>';

        window.loadCustomPlaylist = function(id) {
            const playlists = getCustomPlaylists();
            const pl = playlists.find(p => p.id === id);
            if (!pl || pl.tracks.length === 0) {
                window.showAlertModal("Attention", "Cette playlist est vide ! Éditez-la pour y ajouter des morceaux.");
                return;
            }

            dynamicPlaylist = pl.tracks.map(t => {
                let choices = [`${t.trackName} - ${t.artistName}`];
                while (choices.length < 4) {
                    let randomTrack = pl.tracks[Math.floor(Math.random() * pl.tracks.length)];
                    let decoy = `${randomTrack.trackName} - ${randomTrack.artistName}`;
                    if (!choices.includes(decoy)) {
                        choices.push(decoy);
                    }
                }
                choices.sort(() => Math.random() - 0.5);
                let correctIndex = choices.indexOf(`${t.trackName} - ${t.artistName}`);

                return {
                    audioUrl: t.audioUrl,
                    trackName: t.trackName,
                    artistName: t.artistName,
                    choices: choices,
                    correctIndex: correctIndex
                };
            });

            playedIndices = [];
            document.getElementById('status-label').textContent = `Playlist "${pl.name}" chargée (${dynamicPlaylist.length} titres). Prêt.`;
            document.getElementById('big-counter').textContent = "OK";
            toggleBurgerMenu();

        function renderEditorTracks(pl, filter = '') {
            const container = document.getElementById('editor-tracks-list');

                container.innerHTML = '<div style="color: #a0aec0; text-align: center; font-size: 0.9rem; padding: 30px;">Aucun morceau dans cette playlist.</div>';
                return;
            }

            const query = filter.toLowerCase().trim();
            const filteredTracks = query ? pl.tracks.map((t, idx) => ({t, idx})).filter(({t}) => 
                t.trackName.toLowerCase().includes(query) || 
                t.artistName.toLowerCase().includes(query) || 
                (t.collectionName && t.collectionName.toLowerCase().includes(query))
            ) : pl.tracks.map((t, idx) => ({t, idx}));

            if (filteredTracks.length === 0) {
                container.innerHTML = '<div style="color: #a0aec0; text-align: center; font-size: 0.9rem; padding: 30px;">Aucun morceau trouvé pour ce filtre.</div>';
                return;

                const row = document.createElement('div');

                dynamicPlaylist = validTracks.map((track, idx, arr) => {
                    let choices = [`${track.trackName} - ${track.artistName}`];
                    while (choices.length < 4) {
                        let randomTrack = arr[Math.floor(Math.random() * arr.length)];
                        let decoy = `${randomTrack.trackName} - ${randomTrack.artistName}`;
                        if (!choices.includes(decoy)) {
                            choices.push(decoy);
                        }
                    }
                    choices.sort(() => Math.random() - 0.5);
                    let correctIndex = choices.indexOf(`${track.trackName} - ${track.artistName}`);

                    return {
                        audioUrl: track.previewUrl,
                        trackName: track.trackName,
                        artistName: track.artistName,
                        choices: choices,
                        correctIndex: correctIndex
                    };

        window.resetGameKeepPlayers = function() {
            document.querySelectorAll('.points-badge').forEach(b => b.classList.add('fade-out'));

            setTimeout(() => {
                if (window.dbInstance && window.dbRef && window.dbGet && window.dbUpdate) {
                    window.dbGet(window.dbRef(window.dbInstance, 'players')).then((snapshot) => {
                        const players = snapshot.val();
                        if (players) {
                            Object.keys(players).forEach(playerId => {
                                window.dbUpdate(window.dbRef(window.dbInstance, 'players/' + playerId), {
                                    score: 0,
                                    answered: false,
                                    lastChoice: null,
                                    lastEarnedPoints: 0
                                });
                            });
                        }
                    });
                }
                playedIndices = [];
                window.gameOverTriggered = false;
                pendingVictory = false;
                window.gameHasStarted = true;
                window.updateTargetScoreUI();
                document.getElementById('start-btn-text').textContent = "Morceau suivant";
                document.getElementById('start-btn').classList.add('playing-state');
                document.getElementById('start-btn').onclick = () => { playClickSound(); startNextRound(); };
                startNextRound();
            }, 500);
        }

        function triggerVictorySequence() {
            window.gameOverTriggered = true;
            
            if (window.dbInstance && window.dbRef && window.dbGet) {
                window.dbGet(window.dbRef(window.dbInstance, 'players')).then((snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        let playersArray = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        playersArray.sort((a, b) => (b.score || 0) - (a.score || 0));
                        
                        const winner = playersArray[0];
                        document.getElementById('status-label').textContent = `Victoire éclatante de ${winner.name} !`;
                        document.getElementById('big-counter').textContent = `${winner.score} pts`;
                    }
                });
            }

            document.getElementById('reveal-label').textContent = "Fin de partie";
            document.getElementById('track-info-preview').textContent = `Objectif de ${window.winningScore} atteint.`;
            document.getElementById('reveal-container-box').classList.add('visible');
            
            const startBtn = document.getElementById('start-btn');
            document.getElementById('start-btn-text').textContent = "Nouvelle partie";
            startBtn.disabled = false;
            startBtn.classList.remove('playing-state');
            startBtn.onclick = () => { playClickSound(); resetGameKeepPlayers(); };
        }

        function startNextRound() {
            document.querySelectorAll('.points-badge').forEach(b => b.classList.add('fade-out'));

            if (!window.gameHasStarted) {
                window.gameHasStarted = true;
                window.updateTargetScoreUI();
                document.getElementById('start-btn-text').textContent = "Morceau suivant";
                document.getElementById('start-btn').classList.add('playing-state');
            }

            if (window.gameOverTriggered) return;

            if (dynamicPlaylist.length === 0) {
                window.showAlertModal("Attention", "Veuillez charger des morceaux d'abord.");
                fetchItunesPlaylist();
                return;
            }

            if (playedIndices.length >= dynamicPlaylist.length) {
                playedIndices = [];
            }

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * dynamicPlaylist.length);
            } while (playedIndices.includes(randomIndex));

            playedIndices.push(randomIndex);
            const track = dynamicPlaylist[randomIndex];

            const audioElem = document.getElementById('audio-player');

            // Si le mode audio est sur l'iPad, on lit le son directement sur l'iPad
            if (audioMode === 'ipad') {
                audioElem.src = track.audioUrl;
                audioElem.volume = 0;
                audioElem.play().catch(() => {});

                let fadeVol = 0;
                const fadeInInterval = setInterval(() => {
                    fadeVol += 0.15;
                    if (fadeVol >= 1) {
                        fadeVol = 1;
                        audioElem.volume = 1;
                        clearInterval(fadeInInterval);
                    } else {
                        audioElem.volume = fadeVol;
                    }
                }, 80);
            } else {
                if (audioElem) audioElem.pause();
            }

            document.getElementById('qr-container').classList.add('minimized');
            document.getElementById('reveal-container-box').classList.remove('visible');
            document.getElementById('reveal-label').textContent = "";
            document.getElementById('track-info-preview').textContent = "";

            const startBtn = document.getElementById('start-btn');
            startBtn.disabled = true;

            setTimeout(() => {
                if (window.dbInstance && window.dbRef && window.dbGet && window.dbUpdate) {
                    window.dbGet(window.dbRef(window.dbInstance, 'players')).then((snapshot) => {
                        const players = snapshot.val();
                        if (players) {
                            Object.keys(players).forEach(playerId => {
                                window.dbUpdate(window.dbRef(window.dbInstance, 'players/' + playerId), {
                                    answered: false,
                                    scoredThisRound: false,
                                    lastChoice: null,
                                    lastEarnedPoints: 0
                                });
                            });
                        }
                    });

                    // On prépare l'objet à envoyer à Firebase
                    let gameStatePayload = {
                        status: 'playing',
                        choices: track.choices,
                        trackIndex: randomIndex,
                        trackName: track.trackName,
                        artistName: track.artistName,
                        roundId: Date.now()
                    };

                    // Si on est en mode TV, on transmet l'URL audio pour que la télé la joue
                    if (audioMode === 'tv') {
                        gameStatePayload.audioUrl = track.audioUrl;
                    }

                    window.dbSet(window.dbRef(window.dbInstance, 'gameState'), gameStatePayload);
                }
            }, 300);

            document.getElementById('status-label').textContent = "Extrait en cours...";
            musicTimeLeft = 15;
            document.getElementById('big-counter').textContent = musicTimeLeft;
            
            document.getElementById('vinyl-disc').classList.add('playing');
            roundActive = true;
            window.roundActiveLoop = true;

            const startTime = Date.now();
            const duration = 15000;

            const timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remainingMs = duration - elapsed;
                const remaining = Math.max(0, Math.ceil(remainingMs / 1000));
                
                if (audioMode === 'ipad') {
                    if (remainingMs <= 1500 && remainingMs > 0) {
                        audioElem.volume = 0.4 + (remainingMs / 1500) * 0.6;
                    } else if (remainingMs <= 0) {
                        audioElem.volume = 0.4;
                    }
                }

                if (remaining !== musicTimeLeft) {
                    musicTimeLeft = remaining;
                    document.getElementById('big-counter').textContent = musicTimeLeft;
                    if (window.dbInstance && window.dbRef) {
                        window.dbUpdate(window.dbRef(window.dbInstance, 'gameState'), { timeLeft: musicTimeLeft });
                    }
                }

                if (window.dbInstance && window.dbRef && window.dbGet && window.dbUpdate && roundActive) {
                    window.dbGet(window.dbRef(window.dbInstance, 'players')).then((snapshot) => {
                        const players = snapshot.val();
                        if (players) {
                            Object.keys(players).forEach(id => {
                                const p = players[id];
                                if (p.answered && p.lastChoice !== null && !p.scoredThisRound) {
                                    let pointsChange = 0;
                                    if (p.lastChoice === track.correctIndex) {
                                        pointsChange = musicTimeLeft;
                                    } else {
                                        pointsChange = -5;
                                    }

                                    let newScore = Math.max(0, (p.score || 0) + pointsChange);
                                    
                                    window.dbUpdate(window.dbRef(window.dbInstance, 'players/' + id), {
                                        score: newScore,
                                        scoredThisRound: true,
                                        lastEarnedPoints: pointsChange
                                    });

                                    if (newScore >= window.winningScore) {
                                        pendingVictory = true;
                                    }
                                }
                            });
                        }
                    });
                }

                if (elapsed >= duration) {
                    clearInterval(timerInterval);
                    roundActive = false;
                    window.roundActiveLoop = false;
                    
                    if (window.dbInstance && window.dbRef) {
                        window.dbUpdate(window.dbRef(window.dbInstance, 'gameState'), { status: 'reveal', trackName: track.trackName, artistName: track.artistName });
                    }

                    if (pendingVictory) {
                        triggerVictorySequence();
                    } else {
                        document.getElementById('status-label').textContent = "";
                        document.getElementById('big-counter').textContent = ""; 
                        document.getElementById('reveal-label').textContent = "C'était :";
                        document.getElementById('track-info-preview').textContent = `${track.artistName} - ${track.trackName}`;
                        document.getElementById('reveal-container-box').classList.add('visible');
                        startBtn.disabled = false;
                    }
                }
            }, 100);
        }
    </script>
</body>
</html>
