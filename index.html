<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blind Test - TV Board</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Menu Burger Styling */
        .burger-container {
            position: relative;
        }

        .burger-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .burger-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .burger-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background: white;
            border-radius: 2px;
        }

        .burger-menu {
            position: absolute;
            right: 0;
            top: 55px;
            background: #151b2b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            width: 280px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        .burger-menu.open {
            display: flex;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .menu-item label {
            font-size: 0.9rem;
            color: #a0aec0;
            font-weight: 500;
        }

        .menu-item input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 5px 0;
        }

        .menu-action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .menu-action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .menu-action-btn.danger {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.3);
        }

        .menu-action-btn.danger:hover {
            background: rgba(255, 107, 107, 0.15);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr 450px;
            padding: 30px;
            gap: 30px;
            position: relative;
        }

        .left-zone {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .left-zone.minimized {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 180px;
            height: 180px;
            padding: 10px;
            z-index: 10;
            background: rgba(11, 15, 25, 0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .left-zone.minimized .qr-title,
        .left-zone.minimized .qr-instructions,
        .left-zone.minimized .itunes-search-box {
            display: none;
        }

        .left-zone.minimized .qr-box {
            width: 120px;
            height: 120px;
        }

        .qr-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .qr-box {
            width: 160px;
            height: 160px;
            background: white;
            padding: 8px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
        }

        .itunes-search-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }

        .itunes-search-box input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .center-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .vinyl-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #111 0%, #111 30%, #222 31%, #000 100%);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: spin 8s linear infinite paused;
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        .vinyl-label {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.65rem;
            border: 3px solid #fff;
            text-align: center;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .game-status-display {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .status-title {
            font-size: 1.2rem;
            color: #a0aec0;
            margin-bottom: 5px;
        }

        .counter-wrapper {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px 0;
        }

        .big-counter {
            font-size: 3.8rem;
            font-weight: 800;
            color: #ff007f;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            line-height: 1;
        }

        .track-info-preview {
            margin-top: 5px;
            font-size: 1.1rem;
            color: #e2e8f0;
            font-weight: 600;
            text-align: center;
            min-height: 30px;
        }

        .right-zone {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .right-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            gap: 10px;
        }

        .right-header-bar h2 {
            font-size: 1.05rem;
            white-space: nowrap;
        }

        .players-count {
            background: #7928ca;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* Bouton compact dans l'en-tête (Vert initial, puis Violet) */
        .compact-action-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .compact-action-btn.playing-state {
            background: #7928ca;
            box-shadow: 0 4px 12px rgba(121, 40, 202, 0.3);
        }

        .compact-action-btn:hover {
            transform: scale(1.02);
        }

        .players-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        /* Conteneur de ligne joueur avec masquage strict par défaut (pas de poubelle visible) */
        .player-row-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }

        .player-delete-action {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 80px;
            background: #e53e3e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 1;
        }

        .player-pill {
            position: relative;
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease;
            border-left: 6px solid #ccc;
            z-index: 2;
            touch-action: pan-y;
        }

        .player-pill.swiped {
            transform: translateX(-80px);
        }

        .player-rank {
            font-weight: 800;
            font-size: 1.1rem;
            width: 30px;
            color: #a0aec0;
        }

        .player-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            margin-right: 15px;
            border: 2px solid white;
        }

        .player-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .player-score {
            font-weight: 800;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Blind Test</h1>
        
        <div class="header-right">
            <!-- Menu Burger -->
            <div class="burger-container">
                <div class="burger-btn" onclick="toggleBurgerMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="burger-menu" id="burger-dropdown">
                    <div class="menu-item">
                        <label for="target-input">Objectif de points :</label>
                        <input type="number" id="target-input" value="150" min="50" step="10" onchange="updateTargetScore(this.value)">
                    </div>
                    <div class="menu-divider"></div>
                    <button class="menu-action-btn" onclick="resetGameKeepPlayers(); toggleBurgerMenu();">🔄 Relancer (garder joueurs)</button>
                    <button class="menu-action-btn danger" onclick="removeAllPlayers(); toggleBurgerMenu();">🗑️ Supprimer tous les joueurs</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="left-zone" id="qr-container">
            <div class="qr-title">Rejoindre le jeu</div>
            <div class="qr-box" id="qr-code-box"></div>
            <div class="qr-instructions" style="font-size: 0.85rem; color: #a0aec0; text-align: center;">Scanne avec ton smartphone pour jouer !</div>
            
            <div class="itunes-search-box">
                <input type="text" id="itunes-query" placeholder="Recherche iTunes..." value="variete francaise">
                <button class="compact-action-btn" style="padding: 8px; font-size: 0.85rem; width: 100%;" onclick="fetchItunesPlaylist()">Charger les titres</button>
            </div>
        </div>

        <div class="center-zone">
            <div class="vinyl-container">
                <div class="vinyl" id="vinyl-disc">
                    <div class="vinyl-label" id="vinyl-label-text">BLIND TEST</div>
                </div>
            </div>
            
            <div class="game-status-display">
                <div class="status-title" id="status-label">Charge les morceaux puis clique sur Démarrer</div>
                <div class="counter-wrapper">
                    <div class="big-counter" id="big-counter">--</div>
                </div>
                <div class="track-info-preview" id="track-info-preview"></div>
            </div>

            <!-- Lecteur Audio HTML5 pour l'API iTunes -->
            <audio id="audio-player" preload="auto"></audio>
        </div>

        <div class="right-zone">
            <div class="right-header-bar">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <h2>Joueurs connectés</h2>
                    <span class="players-count" id="player-count">0</span>
                </div>
                <button class="compact-action-btn" id="start-btn" onclick="startNextRound()">
                    <span id="start-btn-text">Démarrer la partie</span>
                </button>
            </div>
            <div class="players-list" id="players-list"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC009nu3gKCkZczF_7w5Iqf9aUMd-TRsBM",
            authDomain: "blindtest-tv.firebaseapp.com",
            databaseURL: "https://blindtest-tv-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "blindtest-tv",
            storageBucket: "blindtest-tv.firebasestorage.app",
            messagingSenderId: "879373587888",
            appId: "1:879373587888:web:df8c99cb8aed5b7acb7275",
            measurementId: "G-J090BQQYZB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.dbInstance = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbUpdate = update;
        window.dbGet = get;
        window.dbRemove = remove;

        let winningScore = 150;

        window.toggleBurgerMenu = function() {
            const dropdown = document.getElementById('burger-dropdown');
            dropdown.classList.toggle('open');
        };

        window.updateTargetScore = function(val) {
            winningScore = parseInt(val) || 150;
        };

        window.removeAllPlayers = function() {
            if (confirm("Voulez-vous vraiment supprimer TOUS les joueurs ?")) {
                remove(ref(db, 'players'));
            }
        };

        const mobileUrl = "https://vincink.github.io/Blind_test-TV/mobile.html"; 
        
        document.getElementById('qr-code-box').innerHTML = `
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(mobileUrl)}" alt="QR Code Mobile">
        `;

        let gameOverTriggered = false;

        const playersRef = ref(db, 'players');
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val();
            const listContainer = document.getElementById('players-list');
            listContainer.innerHTML = '';

            if (!data) {
                document.getElementById('player-count').textContent = '0';
                listContainer.innerHTML = '<div style="color: #a0aec0; text-align: center; margin-top: 20px;">En attente de joueurs</div>';
                return;
            }

            let playersArray = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            }));

            playersArray.sort((a, b) => (b.score || 0) - (a.score || 0));
            document.getElementById('player-count').textContent = playersArray.length;

            playersArray.forEach((player, index) => {
                if ((player.score || 0) >= winningScore && !gameOverTriggered) {
                    gameOverTriggered = true;
                    setTimeout(() => {
                        if (window.roundActiveLoop) return;
                        document.getElementById('status-label').textContent = `🏆 Victoire éclatante de ${player.name} !`;
                        document.getElementById('big-counter').textContent = `${winningScore}+`;
                        document.getElementById('start-btn-text').textContent = "Nouvelle partie";
                        document.getElementById('start-btn').onclick = resetGameKeepPlayers;
                    }, 500);
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'player-row-wrapper';
                
                wrapper.innerHTML = `
                    <div class="player-delete-action" onclick="removePlayer('${player.id}')">
                        <i class="fa-solid fa-trash"></i>
                    </div>
                    <div class="player-pill" id="pill-${player.id}" style="border-color: ${player.color || '#7928ca'}">
                        <div class="player-rank">#${index + 1}</div>
                        <div class="player-avatar" style="background-image: url('${player.avatar || "https://i.pravatar.cc/150?img=1"}')"></div>
                        <div class="player-info">
                            <span class="player-name">${player.name}</span>
                            <span class="player-score" style="color: ${player.color || '#fff'}">${player.score || 0} pts</span>
                        </div>
                    </div>
                `;

                const pill = wrapper.querySelector('.player-pill');
                let startX = 0;

                pill.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                });

                pill.addEventListener('touchmove', (e) => {
                    let moveX = e.touches[0].clientX;
                    let diff = moveX - startX;
                    if (diff < -20) {
                        pill.classList.add('swiped');
                    } else if (diff > 20) {
                        pill.classList.remove('swiped');
                    }
                });

                listContainer.appendChild(wrapper);
            });
        });

        window.removePlayer = function(id) {
            if (confirm("Supprimer ce joueur de la partie ?")) {
                remove(ref(db, 'players/' + id));
            }
        };
    </script>

    <!-- FontAwesome pour la poubelle et les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        let dynamicPlaylist = [];
        let playedIndices = [];
        let roundActive = false;
        let musicTimeLeft = 15;
        window.roundActiveLoop = false;
        let gameHasStarted = false;

        async function fetchItunesPlaylist() {
            const query = document.getElementById('itunes-query').value || "variete francaise";
            document.getElementById('status-label').textContent = "Recherche élargie sur iTunes...";
            
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=200`);
                const data = await response.json();
                
                const validTracks = data.results.filter(track => track.previewUrl && track.trackName && track.artistName);

                if (validTracks.length < 4) {
                    alert("Pas assez de morceaux trouvés. Essaie un autre terme !");
                    return;
                }

                dynamicPlaylist = validTracks.map((track, idx, arr) => {
                    let choices = [`${track.trackName} - ${track.artistName}`];
                    while (choices.length < 4) {
                        let randomTrack = arr[Math.floor(Math.random() * arr.length)];
                        let decoy = `${randomTrack.trackName} - ${randomTrack.artistName}`;
                        if (!choices.includes(decoy)) {
                            choices.push(decoy);
                        }
                    }
                    choices.sort(() => Math.random() - 0.5);
                    let correctIndex = choices.indexOf(`${track.trackName} - ${track.artistName}`);

                    return {
                        audioUrl: track.previewUrl,
                        trackName: track.trackName,
                        artistName: track.artistName,
                        choices: choices,
                        correctIndex: correctIndex
                    };
                });

                playedIndices = [];
                document.getElementById('status-label').textContent = `${dynamicPlaylist.length} morceaux chargés ! Prêt.`;
                document.getElementById('big-counter').textContent = "🚀";
            } catch (err) {
                console.error(err);
                alert("Erreur lors de la connexion à l'API iTunes.");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchItunesPlaylist();
        });

        window.resetGameKeepPlayers = function() {
            if (window.dbInstance && window.dbRef && window.dbGet && window.dbUpdate) {
                window.dbGet(window.dbRef(window.dbInstance, 'players')).then((snapshot) => {
                    const players = snapshot.val();
                    if (players) {
                        Object.keys(players).forEach(playerId => {
                            window.dbUpdate(window.dbRef(window.dbInstance, 'players/' + playerId), {
                                score: 0,
                                answered: false,
                                lastChoice: null
                            });
                        });
                    }
                });
            }
            playedIndices = [];
            gameOverTriggered = false;
            gameHasStarted = true;
            document.getElementById('start-btn-text').textContent = "Morceau suivant";
            document.getElementById('start-btn').classList.add('playing-state');
            document.getElementById('start-btn').onclick = startNextRound;
            startNextRound();
        }

        function startNextRound() {
            if (!gameHasStarted) {
                gameHasStarted = true;
                // Passage du bouton vert au violet « Morceau suivant » dans l'en-tête
                document.getElementById('start-btn-text').textContent = "Morceau suivant";
                document.getElementById('start-btn').classList.add('playing-state');
            }

            if (dynamicPlaylist.length === 0) {
                alert("Veuillez charger les morceaux iTunes d'abord.");
                fetchItunesPlaylist();
                return;
            }

            if (playedIndices.length >= dynamicPlaylist.length) {
                playedIndices = [];
            }

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * dynamicPlaylist.length);
            } while (playedIndices.includes(randomIndex));

            playedIndices.push(randomIndex);
            const track = dynamicPlaylist[randomIndex];

            const audioElem = document.getElementById('audio-player');
            audioElem.play().catch(() => {});

            document.getElementById('qr-container').classList.add('minimized');
            document.getElementById('track-info-preview').textContent = "";

            if (window.dbInstance && window.dbRef && window.dbGet && window.dbUpdate) {
                window.dbGet(window.dbRef(window.dbInstance, 'players')).then((snapshot) => {
                    const players = snapshot.val();
                    if (players) {
                        Object.keys(players).forEach(playerId => {
                            window.dbUpdate(window.dbRef(window.dbInstance, 'players/' + playerId), {
                                answered: false,
                                scoredThisRound: false,
                                lastChoice: null
                            });
                        });
                    }
                });

                window.dbSet(window.dbRef(window.dbInstance, 'gameState'), {
                    status: 'playing',
                    choices: track.choices,
                    trackIndex: randomIndex
                });
            }

            document.getElementById('status-label').textContent = "Extrait en cours...";
            musicTimeLeft = 15;
            document.getElementById('big-counter').textContent = musicTimeLeft;
            
            audioElem.src = track.audioUrl;
            audioElem.play();
            
            document.getElementById('vinyl-disc').classList.add('playing');
            roundActive = true;
            window.roundActiveLoop = true;

            const startTime = Date.now();
            const duration = 15000;

            const timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, Math.ceil((duration - elapsed) / 1000));
                
                if (remaining !== musicTimeLeft) {
                    musicTimeLeft = remaining;
                    document.getElementById('big-counter').textContent = musicTimeLeft;
                    if (window.dbInstance && window.dbRef) {
                        window.dbUpdate(window.dbRef(window.dbInstance, 'gameState'), { timeLeft: musicTimeLeft });
                    }
                }

                if (window.dbInstance && window.dbRef && window.dbGet && window.dbUpdate && roundActive) {
                    window.dbGet(window.dbRef(window.dbInstance, 'players')).then((snapshot) => {
                        const players = snapshot.val();
                        if (players) {
                            Object.keys(players).forEach(id => {
                                const p = players[id];
                                if (p.answered && p.lastChoice !== null && !p.scoredThisRound) {
                                    let pointsEarned = 0;
                                    if (p.lastChoice === track.correctIndex) {
                                        pointsEarned = musicTimeLeft;
                                    }

                                    let newScore = (p.score || 0) + pointsEarned;
                                    window.dbUpdate(window.dbRef(window.dbInstance, 'players/' + id), {
                                        score: newScore,
                                        scoredThisRound: true
                                    });
                                }
                            });
                        }
                    });
                }

                if (elapsed >= duration) {
                    clearInterval(timerInterval);
                    roundActive = false;
                    window.roundActiveLoop = false;

                    audioElem.pause();
                    document.getElementById('vinyl-disc').classList.remove('playing');
                    
                    document.getElementById('status-label').textContent = "C'était :";
                    document.getElementById('track-info-preview').textContent = `${track.artistName} - ${track.trackName}`;
                    document.getElementById('big-counter').textContent = "🎯";
                }
            }, 100);
        }
    </script>
</body>
</html>
