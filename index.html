<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blind Test - TV Board</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* En-tête */
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        button.btn {
            background: #7928ca;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button.btn:hover {
            background: #8a35e6;
            transform: scale(1.02);
        }

        /* Contenu Principal en 3 zones */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr 400px;
            padding: 30px;
            gap: 30px;
            position: relative;
        }

        /* Zone Gauche : QR Code & Lobby info */
        .left-zone {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* État réduit en bas à gauche pendant la partie */
        .left-zone.minimized {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 180px;
            height: 180px;
            padding: 10px;
            z-index: 10;
            background: rgba(11, 15, 25, 0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .left-zone.minimized .qr-title,
        .left-zone.minimized .qr-instructions {
            display: none;
        }

        .left-zone.minimized .qr-box {
            width: 120px;
            height: 120px;
        }

        .qr-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .qr-box {
            width: 180px;
            height: 180px;
            background: white;
            padding: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
        }

        .qr-instructions {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #a0aec0;
            line-height: 1.4;
        }

        /* Zone Centrale : Visuel / Vinyle / Compte à rebours / Lecteur */
        .center-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .vinyl-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #111 0%, #111 30%, #222 31%, #000 100%);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: spin 8s linear infinite paused;
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        .vinyl-label {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            border: 4px solid #fff;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Overlay d'affichage central (Compte à rebours ou Question) */
        .game-status-display {
            text-align: center;
        }

        .status-title {
            font-size: 1.5rem;
            color: #a0aec0;
            margin-bottom: 10px;
        }

        .big-counter {
            font-size: 5rem;
            font-weight: 800;
            color: #ff007f;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
        }

        /* Lecteur YouTube masqué proprement */
        #youtube-player-container {
            display: none;
        }

        /* Zone Droite : Lobby / Classement dynamique des joueurs */
        .right-zone {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .players-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .players-header h2 {
            font-size: 1.2rem;
        }

        .players-count {
            background: #7928ca;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .players-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        /* Style d'une pastille de joueur */
        .player-pill {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border-left: 6px solid #ccc;
        }

        /* État assombri (tant qu'il n'a pas répondu) */
        .player-pill.waiting {
            opacity: 0.4;
            filter: grayscale(40%);
        }

        /* État normal (dès qu'il a répondu) */
        .player-pill.answered {
            opacity: 1;
            filter: none;
            box-shadow: 0 0 15px currentColor;
        }

        .player-rank {
            font-weight: 800;
            font-size: 1.1rem;
            width: 30px;
            color: #a0aec0;
        }

        .player-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            margin-right: 15px;
            border: 2px solid white;
        }

        .player-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .player-score {
            font-weight: 800;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Blind Test Chanson Française</h1>
        <div class="controls">
            <button class="btn" id="start-btn" onclick="startCountdown()">Lancer la partie</button>
        </div>
    </header>

    <main>
        <!-- Zone Gauche : QR Code -->
        <div class="left-zone" id="qr-container">
            <div class="qr-title">Rejoindre le jeu</div>
            <div class="qr-box">
                <!-- Simulation visuelle d'un QR code -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://github.io" alt="QR Code">
            </div>
            <div class="qr-instructions">Scanne avec ton smartphone<br>pour jouer !</div>
        </div>

        <!-- Zone Centrale : Animation & Compteur -->
        <div class="center-zone">
            <div class="vinyl-container">
                <div class="vinyl" id="vinyl-disc">
                    <div class="vinyl-label">BLIND TEST</div>
                </div>
            </div>
            
            <div class="game-status-display">
                <div class="status-title" id="status-label">En attente des joueurs...</div>
                <div class="big-counter" id="big-counter">--</div>
            </div>

            <!-- Lecteur YouTube intégré (Source: evOJ-Lh6gMs) -->
            <div id="youtube-player-container">
                <div id="yt-player"></div>
            </div>
        </div>

        <!-- Zone Droite : Classement dynamique des joueurs -->
        <div class="right-zone">
            <div class="players-header">
                <h2>Joueurs connectés</h2>
                <span class="players-count" id="player-count">0</span>
            </div>
            <div class="players-list" id="players-list">
                <!-- Les joueurs s'ajouteront dynamiquement ici -->
            </div>
        </div>
    </main>

    <!-- Script YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Palette des 10 couleurs arc-en-ciel uniques et vibrantes
        const rainbowColors = [
            "#FF0055", "#FF5500", "#FFAA00", "#00CC66", "#00CCCC", 
            "#0066FF", "#7B00FF", "#FF00AA", "#55FF00", "#00FFCC"
        ];

        // Exemple de données fictives de joueurs pour tester le rendu visuel
        let players = [
            { id: 1, name: "Thomas", score: 45, color: rainbowColors[0], answered: true, avatar: "https://i.pravatar.cc/150?img=1" },
            { id: 2, name: "Sarah", score: 38, color: rainbowColors[1], answered: false, avatar: "https://i.pravatar.cc/150?img=5" },
            { id: 3, name: "Lucas", score: 30, color: rainbowColors[2], answered: true, avatar: "https://i.pravatar.cc/150?img=3" },
            { id: 4, name: "Julie", score: 25, color: rainbowColors[3], answered: false, avatar: "https://i.pravatar.cc/150?img=9" }
        ];

        function renderPlayers() {
            // Trier les joueurs par score décroissant pour le classement dynamique
            players.sort((a, b) => b.score - a.score);
            
            const listContainer = document.getElementById('players-list');
            listContainer.innerHTML = '';
            
            document.getElementById('player-count').textContent = players.length;

            players.forEach((player, index) => {
                const pill = document.createElement('div');
                // Si le joueur n'a pas répondu, on applique la classe .waiting (assombri)
                // Sinon .apres/normal .answered
                const statusClass = player.answered ? 'answered' : 'waiting';
                
                pill.className = `player-pill ${statusClass}`;
                pill.style.borderColor = player.color;
                if(player.answered) {
                    pill.style.color = player.color;
                }

                pill.innerHTML = `
                    <div class="player-rank">#${index + 1}</div>
                    <div class="player-avatar" style="background-image: url('${player.avatar}')"></div>
                    <div class="player-info">
                        <span class="player-name" style="color: ${player.answered ? '#fff' : '#a0aec0'}">${player.name}</span>
                        <span class="player-score">${player.score} pts</span>
                    </div>
                `;
                listContainer.appendChild(pill);
            });
        }

        // Initialisation de l'affichage des joueurs au démarrage
        renderPlayers();

        // Gestionnaire du lancement de partie (Compte à rebours 5s puis musique)
        let playerYT;
        function onYouTubeIframeAPIReady() {
            playerYT = new YT.Player('yt-player', {
                height: '0',
                width: '0',
                videoId: 'evOJ-Lh6gMs', // Identifiant validé
                playerVars: {
                    'autoplay': 0,
                    'start': 45 // Exemple de départ au milieu d'un refrain
                }
            });
        }

        function startCountdown() {
            // 1. Réduire le QR code en bas à gauche
            document.getElementById('qr-container').classList.add('minimized');
            document.getElementById('start-btn').style.display = 'none';
            
            let countdown = 5;
            document.getElementById('status-label').textContent = "La manche commence dans...";
            
            const timerInterval = setInterval(() => {
                document.getElementById('big-counter').textContent = countdown;
                countdown--;

                if (countdown < 0) {
                    clearInterval(timerInterval);
                    startMusicSnippet();
                }
            }, 1000);
        }

        function startMusicSnippet() {
            document.getElementById('status-label').textContent = "Écoutez bien l'extrait ! (15s)";
            document.getElementById('big-counter').textContent = "15";
            
            // Lancer la lecture audio YouTube
            if (playerYT && playerYT.playVideo) {
                playerYT.playVideo();
            }
            
            // Activer l'animation du vinyle
            document.getElementById('vinyl-disc').classList.add('playing');

            // Lancer le compteur de l'extrait de 15 secondes
            let musicTimeLeft = 15;
            const musicInterval = setInterval(() => {
                musicTimeLeft--;
                document.getElementById('big-counter').textContent = musicTimeLeft;

                if (musicTimeLeft <= 0) {
                    clearInterval(musicInterval);
                    if (playerYT && playerYT.stopVideo) {
                        playerYT.stopVideo();
                    }
                    document.getElementById('vinyl-disc').classList.remove('playing');
                    document.getElementById('status-label').textContent = "Fin de l'extrait ! Résultats...";
                    document.getElementById('big-counter').textContent = "🎯";
                }
            }, 1000);
        }
    </script>
</body>
</html>
