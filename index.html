<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blind Test - TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #22c55e, #eab308);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Menu Burger d'origine */
        .burger-menu-container {
            position: relative;
        }

        .burger-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            font-size: 1.5rem;
        }

        .burger-dropdown {
            position: absolute;
            right: 0;
            top: 60px;
            background: #151b2b;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            min-width: 220px;
        }

        .burger-dropdown.open {
            display: flex;
        }

        .burger-dropdown button {
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-align: left;
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .burger-dropdown button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .main-container {
            flex: 1;
            display: flex;
            padding: 40px;
            gap: 40px;
            overflow: hidden;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            text-align: center;
            background: rgba(20, 25, 40, 0.6);
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
        }

        .status-message {
            font-size: 2.2rem;
            font-weight: 700;
            color: #e2e8f0;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .qr-container img {
            width: 180px;
            height: 180px;
            display: block;
        }

        .url-text {
            font-size: 1.4rem;
            color: #94a3b8;
            word-break: break-all;
        }

        /* Colonne de droite et pastilles longues d'origine */
        .right-panel {
            width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(15, 20, 32, 0.8);
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-score-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-radius: 18px;
            background: rgba(25, 30, 45, 0.95);
            border: 3px solid var(--player-color, #22c55e);
            box-shadow: 0 8px 25px var(--player-glow, rgba(34, 197, 94, 0.4));
            width: 100%; /* Pastilles longues sur toute la largeur du panneau */
        }

        .player-info-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .player-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 3px solid white;
            background-color: #1a202c;
        }

        .player-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
        }

        .player-score {
            font-size: 1.7rem;
            font-weight: 900;
            color: var(--player-color, #22c55e);
        }

        /* Écran de Victoire / Ex-aequo */
        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 15, 25, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            gap: 25px;
            padding: 40px;
            text-align: center;
        }

        .victory-overlay.active {
            display: flex;
        }

        .victory-title {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, #eab308, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .winners-grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .winner-card {
            background: rgba(25, 30, 45, 0.95);
            border: 4px solid var(--winner-color, #eab308);
            padding: 25px 35px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 40px rgba(234, 179, 8, 0.4);
        }

        .winner-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 4px solid white;
        }

        .winner-name {
            font-size: 2rem;
            font-weight: 800;
            color: white;
        }

        .winner-score-text {
            font-size: 1.6rem;
            font-weight: 700;
            color: #eab308;
        }

        .victory-buttons {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .btn-restart {
            padding: 18px 35px;
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #22c55e, #16a34a);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.5);
        }

        .btn-quit {
            padding: 18px 35px;
            font-size: 1.5rem;
            font-weight: bold;
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #ef4444;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2);
            transition: all 0.2s ease;
        }

        .btn-quit:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Blind Test</h1>
        <div class="burger-menu-container">
            <button class="burger-btn" onclick="toggleBurgerMenu()">☰</button>
            <div class="burger-dropdown" id="burger-dropdown">
                <button onclick="resetGame()">Nouvelle Partie</button>
                <button onclick="clearAllPlayers()">Effacer les joueurs</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Panneau central : QR Code -->
        <div class="left-panel" id="tv-main-display">
            <div class="status-message">Scanne le QR Code pour rejoindre la partie sur ton téléphone !</div>
            <div class="qr-container">
                <img id="qr-code-img" src="" alt="QR Code Connexion">
            </div>
            <div class="url-text" id="app-url-display">Chargement de l'URL...</div>
        </div>

        <!-- Panneau latéral : Liste des scores -->
        <div class="right-panel">
            <div class="panel-title">Joueurs connectés</div>
            <div class="players-list" id="tv-players-list"></div>
        </div>
    </div>

    <!-- Écran de Victoire / Ex-aequo -->
    <div class="victory-overlay" id="victory-screen">
        <div class="victory-title" id="victory-title-text">Victoire !</div>
        <div class="winners-grid" id="winners-container"></div>
        <div class="victory-buttons">
            <button class="btn-restart" onclick="resetGame()">Nouvelle Partie</button>
            <button class="btn-quit" onclick="resetGame()">Quitter</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC009nu3gKCkZczF_7w5Iqf9aUMd-TRsBM",
            authDomain: "blindtest-tv.firebaseapp.com",
            databaseURL: "https://blindtest-tv-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "blindtest-tv",
            storageBucket: "blindtest-tv.firebasestorage.app",
            messagingSenderId: "879373587888",
            appId: "1:879373587888:web:df8c99cb8aed5b7acb7275",
            measurementId: "G-J090BQQYZB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const TARGET_SCORE = 150;

        const mobileUrl = window.location.href.replace('tv.html', 'mobile.html');
        document.getElementById('app-url-display').textContent = mobileUrl;
        document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(mobileUrl)}`;

        let gameEnded = false;

        window.toggleBurgerMenu = function() {
            document.getElementById('burger-dropdown').classList.toggle('open');
        };

        window.addEventListener('click', function(e) {
            if (!e.target.closest('.burger-menu-container')) {
                document.getElementById('burger-dropdown').classList.remove('open');
            }
        });

        onValue(ref(db, 'players'), (snapshot) => {
            if (gameEnded) return;

            const playersData = snapshot.val() || {};
            const listEl = document.getElementById('tv-players-list');
            listEl.innerHTML = '';

            const playersArray = Object.keys(playersData).map(key => ({
                id: key,
                ...playersData[key]
            }));

            playersArray.sort((a, b) => (b.score || 0) - (a.score || 0));

            if (playersArray.length === 0) {
                listEl.innerHTML = `<div style="color: #64748b; font-size: 1.3rem; text-align: center; padding: 20px;">Aucun joueur connecté</div>`;
                return;
            }

            let maxScoreAchieved = 0;
            let potentialWinners = [];

            playersArray.forEach(player => {
                const pColor = player.color || '#22c55e';
                let glowColor = 'rgba(34, 197, 94, 0.4)';
                if (pColor.startsWith('#') && pColor.length === 7) {
                    let r = parseInt(pColor.slice(1, 3), 16);
                    let g = parseInt(pColor.slice(3, 5), 16);
                    let b = parseInt(pColor.slice(5, 7), 16);
                    glowColor = `rgba(${r}, ${g}, ${b}, 0.4)`;
                }

                const pill = document.createElement('div');
                pill.className = 'player-score-pill';
                pill.style.setProperty('--player-color', pColor);
                pill.style.setProperty('--player-glow', glowColor);
                pill.innerHTML = `
                    <div class="player-info-left">
                        <div class="player-avatar" style="background-image: url('${player.avatar || ''}')"></div>
                        <div class="player-name">${escapeHtml(player.name)}</div>
                    </div>
                    <div class="player-score">${player.score || 0} pts</div>
                `;
                listEl.appendChild(pill);

                const currentScore = player.score || 0;
                if (currentScore >= TARGET_SCORE) {
                    if (currentScore > maxScoreAchieved) {
                        maxScoreAchieved = currentScore;
                        potentialWinners = [player];
                    } else if (currentScore === maxScoreAchieved) {
                        potentialWinners.push(player);
                    }
                }
            });

            if (potentialWinners.length > 0) {
                gameEnded = true;
                showVictoryScreen(potentialWinners, maxScoreAchieved);
            }
        });

        function showVictoryScreen(winners, score) {
            const overlay = document.getElementById('victory-screen');
            const container = document.getElementById('winners-container');
            const titleText = document.getElementById('victory-title-text');
            
            container.innerHTML = '';

            if (winners.length > 1) {
                titleText.textContent = `Égalité Parfaite (Ex-aequo) !`;
            } else {
                titleText.textContent = `Victoire Éclatante de ${winners[0].name} !`;
            }

            winners.forEach(winner => {
                const card = document.createElement('div');
                card.className = 'winner-card';
                card.style.setProperty('--winner-color', winner.color || '#eab308');
                card.innerHTML = `
                    <div class="winner-avatar" style="background-image: url('${winner.avatar}')"></div>
                    <div class="winner-name">${escapeHtml(winner.name)}</div>
                    <div class="winner-score-text">${score} pts</div>
                `;
                container.appendChild(card);
            });

            overlay.classList.add('active');
        }

        window.resetGame = async function() {
            document.getElementById('burger-dropdown').classList.remove('open');
            const snapshot = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js").then(async ({get}) => get(ref(db, 'players')));
            const players = snapshot.val() || {};
            
            const updates = {};
            Object.keys(players).forEach(id => {
                updates[`players/${id}/score`] = 0;
                updates[`players/${id}/answered`] = false;
            });
            
            await update(ref(db), updates);
            document.getElementById('victory-screen').classList.remove('active');
            gameEnded = false;
        };

        window.clearAllPlayers = async function() {
            document.getElementById('burger-dropdown').classList.remove('open');
            if (confirm("Voulez-vous vraiment effacer tous les joueurs ?")) {
                await remove(ref(db, 'players'));
                document.getElementById('victory-screen').classList.remove('active');
                gameEnded = false;
            }
        };

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
