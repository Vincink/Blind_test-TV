<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blind Test - TV Board</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        button.btn {
            background: #7928ca;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button.btn:hover {
            background: #8a35e6;
            transform: scale(1.02);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr 400px;
            padding: 30px;
            gap: 30px;
            position: relative;
        }

        .left-zone {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .left-zone.minimized {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 180px;
            height: 180px;
            padding: 10px;
            z-index: 10;
            background: rgba(11, 15, 25, 0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .left-zone.minimized .qr-title,
        .left-zone.minimized .qr-instructions {
            display: none;
        }

        .left-zone.minimized .qr-box {
            width: 120px;
            height: 120px;
        }

        .qr-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .qr-box {
            width: 180px;
            height: 180px;
            background: white;
            padding: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
        }

        .qr-instructions {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #a0aec0;
            line-height: 1.4;
        }

        .center-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .vinyl-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #111 0%, #111 30%, #222 31%, #000 100%);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: spin 8s linear infinite paused;
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        .vinyl-label {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            border: 4px solid #fff;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .game-status-display {
            text-align: center;
        }

        .status-title {
            font-size: 1.5rem;
            color: #a0aec0;
            margin-bottom: 10px;
        }

        .big-counter {
            font-size: 5rem;
            font-weight: 800;
            color: #ff007f;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
        }

        #youtube-player-container {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.01;
            pointer-events: none;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        .right-zone {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .players-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .players-header h2 {
            font-size: 1.2rem;
        }

        .players-count {
            background: #7928ca;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .players-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .player-pill {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 6px solid #ccc;
        }

        .player-pill.waiting {
            opacity: 0.4;
            filter: grayscale(40%);
        }

        .player-pill.answered {
            opacity: 1;
            filter: none;
            box-shadow: 0 0 15px currentColor;
        }

        .player-rank {
            font-weight: 800;
            font-size: 1.1rem;
            width: 30px;
            color: #a0aec0;
        }

        .player-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            margin-right: 15px;
            border: 2px solid white;
        }

        .player-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .player-score {
            font-weight: 800;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Blind Test Chanson Française (Objectif: 150 pts)</h1>
        <div class="controls">
            <button class="btn" id="start-btn" onclick="startNextRound()">Lancer la manche</button>
        </div>
    </header>

    <main>
        <div class="left-zone" id="qr-container">
            <div class="qr-title">Rejoindre le jeu</div>
            <div class="qr-box" id="qr-code-box"></div>
            <div class="qr-instructions">Scanne avec ton smartphone<br>pour jouer !</div>
        </div>

        <div class="center-zone">
            <div class="vinyl-container">
                <div class="vinyl" id="vinyl-disc">
                    <div class="vinyl-label">BLIND TEST</div>
                </div>
            </div>
            
            <div class="game-status-display">
                <div class="status-title" id="status-label">En attente des joueurs...</div>
                <div class="big-counter" id="big-counter">--</div>
            </div>

            <div id="youtube-player-container">
                <div id="yt-player"></div>
            </div>
        </div>

        <div class="right-zone">
            <div class="players-header">
                <h2>Classement</h2>
                <span class="players-count" id="player-count">0</span>
            </div>
            <div class="players-list" id="players-list"></div>
        </div>
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC009nu3gKCkZczF_7w5Iqf9aUMd-TRsBM",
            authDomain: "blindtest-tv.firebaseapp.com",
            databaseURL: "https://blindtest-tv-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "blindtest-tv",
            storageBucket: "blindtest-tv.firebasestorage.app",
            messagingSenderId: "879373587888",
            appId: "1:879373587888:web:df8c99cb8aed5b7acb7275",
            measurementId: "G-J090BQQYZB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.dbInstance = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbUpdate = update;
        window.dbGet = get;

        const mobileUrl = "https://vincink.github.io/Blind_test-TV/mobile.html"; 
        
        document.getElementById('qr-code-box').innerHTML = `
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(mobileUrl)}" alt="QR Code Mobile">
        `;

        const playersRef = ref(db, 'players');
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val();
            const listContainer = document.getElementById('players-list');
            listContainer.innerHTML = '';

            if (!data) {
                document.getElementById('player-count').textContent = '0';
                listContainer.innerHTML = '<div style="color: #a0aec0; text-align: center; margin-top: 20px;">En attente de connexions...</div>';
                return;
            }

            let playersArray = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            }));

            playersArray.sort((a, b) => (b.score || 0) - (a.score || 0));
            document.getElementById('player-count').textContent = playersArray.length;

            // Vérifier si un joueur a atteint 150 points
            playersArray.forEach((player, index) => {
                if ((player.score || 0) >= 150) {
                    document.getElementById('status-label').textContent = `🏆 Victoire de ${player.name} !`;
                    document.getElementById('big-counter').textContent = "150+";
                    document.getElementById('start-btn').style.display = 'none';
                }

                const pill = document.createElement('div');
                const statusClass = player.answered ? 'answered' : 'waiting';
                
                pill.className = `player-pill ${statusClass}`;
                pill.style.borderColor = player.color || '#7928ca';
                if(player.answered) {
                    pill.style.color = player.color || '#fff';
                }

                pill.innerHTML = `
                    <div class="player-rank">#${index + 1}</div>
                    <div class="player-avatar" style="background-image: url('${player.avatar || "https://i.pravatar.cc/150?img=1"}')"></div>
                    <div class="player-info">
                        <span class="player-name" style="color: ${player.answered ? '#fff' : '#a0aec0'}">${player.name}</span>
                        <span class="player-score">${player.score || 0} pts</span>
                    </div>
                `;
                listContainer.appendChild(pill);
            });
        });
    </script>

    <script>
        // Playlist avec la bonne réponse (correctIndex de 0 à 3)
        const playlist = [
            {
                videoId: "evOJ-Lh6gMs",
                start: 45,
                choices: ["Stromae - Papaoutai", "Indila - Dernière Danse", "Camélia Jordana - Non", "Zaz - Je veux"],
                correctIndex: 0
            },
            {
                videoId: "1-S5l0CCu64",
                start: 30,
                choices: ["Manau - La Tribu de Dana", "Daft Punk - One More Time", "Kendji Girac - Color Gitano", "Stromae - Alors on danse"],
                correctIndex: 1
            }
        ];

        let currentTrackIndex = 0;
        let playerYT;
        let roundActive = false;
        let answerTimes = []; // Enregistre l'ordre des réponses pour attribuer de 15 à 0 pts

        function onYouTubeIframeAPIReady() {
            playerYT = new YT.Player('yt-player', {
                height: '100',
                width: '100',
                videoId: playlist[0].videoId,
                playerVars: {
                    'autoplay': 0,
                    'start': playlist[0].start,
                    'controls': 0
                }
            });
        }

        function startNextRound() {
            if (currentTrackIndex >= playlist.length) {
                currentTrackIndex = 0; // Boucle la playlist si nécessaire
            }

            // Déverrouillage audio iPad
            if (playerYT && playerYT.playVideo) {
                playerYT.playVideo();
                playerYT.pauseVideo();
            }

            roundActive = true;
            answerTimes = [];

            // Réinitialiser les réponses des joueurs pour la nouvelle manche (sans toucher aux scores cumulés)
            if (window.dbInstance && window.dbRef && window.dbGet && window.dbUpdate) {
                window.dbGet(window.dbRef(window.dbInstance, 'players')).then((snapshot) => {
                    const players = snapshot.val();
                    if (players) {
                        Object.keys(players).forEach(playerId => {
                            window.dbUpdate(window.dbRef(window.dbInstance, 'players/' + playerId), {
                                answered: false,
                                lastChoice: null
                            });
                        });
                    }
                });

                // Envoyer les choix aux téléphones
                window.dbSet(window.dbRef(window.dbInstance, 'gameState'), {
                    status: 'playing',
                    choices: playlist[currentTrackIndex].choices,
                    trackIndex: currentTrackIndex
                });
            }

            document.getElementById('qr-container').classList.add('minimized');
            document.getElementById('start-btn').style.display = 'none';
            
            let countdown = 5;
            document.getElementById('status-label').textContent = "La manche commence dans...";
            
            const timerInterval = setInterval(() => {
                document.getElementById('big-counter').textContent = countdown;
                countdown--;

                if (countdown < 0) {
                    clearInterval(timerInterval);
                    startMusicSnippet();
                }
            }, 1000);
        }

        function startMusicSnippet() {
            document.getElementById('status-label').textContent = "Écoutez bien l'extrait ! (15s)";
            document.getElementById('big-counter').textContent = "15";
            
            const track = playlist[currentTrackIndex];
            if (playerYT && playerYT.loadVideoById) {
                playerYT.loadVideoById({
                    'videoId': track.videoId,
                    'startSeconds': track.start
                });
                playerYT.playVideo();
            }
            
            document.getElementById('vinyl-disc').classList.add('playing');

            // Écouter les réponses en temps réel pendant les 15 secondes
            const scoreCheckInterval = setInterval(() => {
                if (window.dbInstance && window.dbRef && window.dbGet) {
                    window.dbGet(window.dbRef(window.dbInstance, 'players')).then((snapshot) => {
                        const players = snapshot.val();
                        if (players && roundActive) {
                            Object.keys(players).forEach(id => {
                                const p = players[id];
                                // Si le joueur a répondu et n'a pas encore été comptabilisé pour cette manche
                                if (p.answered && !answerTimes.some(item => item.id === id)) {
                                    answerTimes.push({
                                        id: id,
                                        choice: p.lastChoice,
                                        timestamp: p.answerTimestamp || Date.now()
                                    });

                                    // Calculer les points selon le rang de rapidité (15, 14, 13... jusqu'à 0)
                                    let rank = answerTimes.length - 1;
                                    let pointsEarned = Math.max(0, 15 - (rank * 3)); // 1er: 15pts, 2ème: 12pts, etc.

                                    // Vérifier si la réponse est correcte
                                    if (p.choice === track.correctIndex) {
                                        let newScore = (p.score || 0) + pointsEarned;
                                        window.dbUpdate(window.dbRef(window.dbInstance, 'players/' + id), {
                                            score: newScore
                                        });
                                    }
                                }
                            });
                        }
                    });
                }
            }, 500);

            let musicTimeLeft = 15;
            const musicInterval = setInterval(() => {
                musicTimeLeft--;
                document.getElementById('big-counter').textContent = musicTimeLeft;

                if (musicTimeLeft <= 0) {
                    clearInterval(musicInterval);
                    clearInterval(scoreCheckInterval);
                    roundActive = false;

                    if (playerYT && playerYT.stopVideo) {
                        playerYT.stopVideo();
                    }
                    document.getElementById('vinyl-disc').classList.remove('playing');
                    document.getElementById('status-label').textContent = "Fin de l'extrait ! Préparez la suite...";
                    document.getElementById('big-counter').textContent = "🎯";
                    
                    currentTrackIndex++;
                    document.getElementById('start-btn').textContent = "Manche suivante";
                    document.getElementById('start-btn').style.display = 'block';
                }
            }, 1000);
        }
    </script>
</body>
</html>
