<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blind Test - Télécommande Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .hidden {
            display: none !important;
        }

        .login-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-card h2 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #ff007f;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .waiting-screen {
            text-align: center;
        }

        .waiting-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #ff007f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .game-screen {
            justify-content: space-between;
            padding: 20px 0;
            height: 100%;
        }

        .game-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .game-header p {
            color: #a0aec0;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .game-header h3 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .choices-container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
        }

        .choice-btn {
            width: 100%;
            min-height: 85px;
            border-radius: 16px;
            border: none;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: bold;
            padding: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s, filter 0.2s;
        }

        .choice-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .choice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(50%);
        }

        .btn-pink { background: linear-gradient(135deg, #ff007f, #d60068); }
        .btn-orange { background: linear-gradient(135deg, #ff7b00, #e06c00); }
        .btn-yellow { background: linear-gradient(135deg, #ffd700, #cca300); color: #0b0f19; }
        .btn-purple { background: linear-gradient(135deg, #7928ca, #5b1b9e); }

        .player-status-footer {
            text-align: center;
            font-size: 0.9rem;
            color: #a0aec0;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div id="screen-login" class="screen">
        <div class="login-card">
            <h2>Rejoindre le Blind Test</h2>
            <input type="text" id="pseudo-input" placeholder="Entre ton pseudo..." maxlength="15" autocomplete="off">
            <button class="btn" onclick="joinGame()">C'est parti !</button>
        </div>
    </div>

    <div id="screen-waiting" class="screen hidden">
        <div class="waiting-screen">
            <div class="waiting-spinner"></div>
            <h2 id="welcome-msg" style="margin-bottom: 10px;">Tu es dans la partie !</h2>
            <p style="color: #a0aec0;">Attente du lancement par l'hôte sur la TV...</p>
        </div>
    </div>

    <div id="screen-game" class="screen game-screen hidden">
        <div class="game-header">
            <p>Sélectionne la bonne réponse</p>
            <h3 id="question-label">Artiste et Titre ?</h3>
        </div>

        <div class="choices-container">
            <button class="choice-btn btn-pink" onclick="sendAnswer(0)" id="choice-0">Chargement...</button>
            <button class="choice-btn btn-orange" onclick="sendAnswer(1)" id="choice-1">Chargement...</button>
            <button class="choice-btn btn-yellow" onclick="sendAnswer(2)" id="choice-2">Chargement...</button>
            <button class="choice-btn btn-purple" onclick="sendAnswer(3)" id="choice-3">Chargement...</button>
        </div>

        <div class="player-status-footer" id="answer-feedback">
            Reste rapide pour maximiser tes points !
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC009nu3gKCkZczF_7w5Iqf9aUMd-TRsBM",
            authDomain: "blindtest-tv.firebaseapp.com",
            databaseURL: "https://blindtest-tv-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "blindtest-tv",
            storageBucket: "blindtest-tv.firebasestorage.app",
            messagingSenderId: "879373587888",
            appId: "1:879373587888:web:df8c99cb8aed5b7acb7275",
            measurementId: "G-J090BQQYZB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const rainbowColors = [
            "#FF0055", "#FF5500", "#FFAA00", "#00CC66", "#00CCCC", 
            "#0066FF", "#7B00FF", "#FF00AA", "#55FF00", "#00FFCC"
        ];

        let playerId = "player_" + Math.random().toString(36).substr(2, 9);
        let playerColor = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];
        let hasAnsweredCurrentRound = false;

        window.joinGame = function() {
            const pseudo = document.getElementById('pseudo-input').value.trim();
            if (!pseudo) {
                alert("Entre un pseudo valide !");
                return;
            }

            set(ref(db, 'players/' + playerId), {
                name: pseudo,
                score: 0,
                color: playerColor,
                answered: false,
                avatar: "https://i.pravatar.cc/150?img=" + Math.floor(Math.random() * 70)
            }).then(() => {
                document.getElementById('screen-login').classList.add('hidden');
                document.getElementById('screen-waiting').classList.remove('hidden');
                document.getElementById('welcome-msg').textContent = `Bienvenue, ${pseudo} !`;
            });
        };

        const gameStateRef = ref(db, 'gameState');
        onValue(gameStateRef, (snapshot) => {
            const state = snapshot.val();
            if (state && state.status === 'playing') {
                // Nouvelle manche lancée : on réactive les boutons pour ce tour
                document.getElementById('screen-waiting').classList.add('hidden');
                document.getElementById('screen-game').classList.remove('hidden');
                
                hasAnsweredCurrentRound = false;
                document.getElementById('answer-feedback').textContent = "Choisis vite !";
                
                for (let i = 0; i < 4; i++) {
                    document.getElementById(`choice-${i}`).disabled = false;
                }

                if (state.choices) {
                    for (let i = 0; i < 4; i++) {
                        document.getElementById(`choice-${i}`).textContent = state.choices[i];
                    }
                }
            }
        });

        window.sendAnswer = function(choiceIndex) {
            if (hasAnsweredCurrentRound) return;
            hasAnsweredCurrentRound = true;

            for (let i = 0; i < 4; i++) {
                document.getElementById(`choice-${i}`).disabled = true;
            }

            document.getElementById('answer-feedback').textContent = "Réponse enregistrée ! En attente des résultats...";

            update(ref(db, 'players/' + playerId), {
                answered: true,
                lastChoice: choiceIndex,
                answerTimestamp: Date.now()
            });
        };
    </script>
</body>
</html>
