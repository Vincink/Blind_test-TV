<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blind Test - Joueur</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.3rem;
            background: linear-gradient(45deg, #22c55e, #eab308);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Modale de dialogue */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #151b2b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .modal-message {
            font-size: 0.9rem;
            color: #a0aec0;
            line-height: 1.4;
        }

        .modal-btn {
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #22c55e;
            border-color: #16a34a;
            color: white;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            overflow-y: auto;
        }

        /* Écran de Connexion */
        #login-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            align-items: center;
            height: 100%;
            max-width: 320px;
            margin: 0 auto;
            width: 100%;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: #a0aec0;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .avatar-preview-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cartoon-avatar-display {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid #22c55e;
            background-color: #1a202c;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: linear-gradient(45deg, #22c55e, #16a34a);
            color: white;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(34, 197, 94, 0.4);
        }

        /* Écran de Jeu */
        #game-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            gap: 15px;
        }

        .player-pill-container {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(25, 30, 45, 0.95);
            border: 2.5px solid var(--player-color, #22c55e);
            box-shadow: 0 0 15px 2px var(--player-glow, rgba(34, 197, 94, 0.6));
            justify-content: space-between;
        }

        .player-profile-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-avatar-badge {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid white;
            background-color: #1a202c;
        }

        .player-name-text {
            font-weight: 700;
            font-size: 1.05rem;
            color: white;
        }

        .player-score-badge {
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--player-color, #22c55e);
        }

        .game-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .timer-circle {
            font-size: 1.8rem;
            font-weight: 800;
            color: #a0aec0;
            margin-bottom: 5px;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            width: 100%;
            max-width: 400px;
        }

        .choice-btn {
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 22px 18px;
            border-radius: 16px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            touch-action: manipulation;
        }

        .choice-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .choice-btn.selected {
            background: #ffffff !important;
            color: #0b0f19 !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
        }

        .choice-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .waiting-message {
            font-size: 1.1rem;
            color: #a0aec0;
            text-align: center;
            font-weight: 500;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Blind Test</h1>
    </header>

    <!-- Modale d'alerte -->
    <div class="modal-overlay" id="custom-modal">
        <div class="modal-card">
            <div class="modal-title" id="modal-title">Information</div>
            <div class="modal-message" id="modal-message">Message</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <main>
        <!-- ÉCRAN DE CONNEXION -->
        <div id="login-screen">
            <div class="input-group">
                <label>Ton Pseudo</label>
                <input type="text" id="player-name-input" placeholder="Ex: Alex" maxlength="15" oninput="updateCartoonAvatar()">
            </div>

            <div class="input-group">
                <label>Ton Avatar Cartoon (généré auto)</label>
                <div class="avatar-preview-box">
                    <div class="cartoon-avatar-display" id="preview-avatar"></div>
                    <span style="font-size: 0.85rem; color: #a0aec0;">Change ton pseudo pour voir ton personnage !</span>
                </div>
            </div>

            <button class="btn-primary" onclick="joinGame()">Rejoindre la partie</button>
        </div>

        <!-- ÉCRAN DE JEU -->
        <div id="game-screen">
            <!-- Pastille de score -->
            <div class="player-pill-container" id="my-player-pill">
                <div class="player-profile-left">
                    <div class="player-avatar-badge" id="display-avatar"></div>
                    <div class="player-name-text" id="display-name">Nom</div>
                </div>
                <div class="player-score-badge" id="display-score">0 pts</div>
            </div>

            <div class="game-board" id="game-board-content">
                <div class="waiting-message" id="waiting-text">En attente du lancement du morceau par la TV...</div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC009nu3gKCkZczF_7w5Iqf9aUMd-TRsBM",
            authDomain: "blindtest-tv.firebaseapp.com",
            databaseURL: "https://blindtest-tv-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "blindtest-tv",
            storageBucket: "blindtest-tv.firebasestorage.app",
            messagingSenderId: "879373587888",
            appId: "1:879373587888:web:df8c99cb8aed5b7acb7275",
            measurementId: "G-J090BQQYZB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.playClickSound = function() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        };

        window.showAlertModal = function(title, message) {
            playClickSound();
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('custom-modal').classList.add('open');
        };

        window.closeModal = function() {
            playClickSound();
            document.getElementById('custom-modal').classList.remove('open');
        };

        // Anti-mise en veille (Wake Lock API)
        let wakeLock = null;
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') { await requestWakeLock(); }
        });

        function getCartoonAvatarUrl(seed) {
            const safeSeed = seed && seed.trim() !== "" ? seed.trim() : "player";
            return `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(safeSeed)}`;
        }

        window.updateCartoonAvatar = function() {
            const name = document.getElementById('player-name-input').value;
            const url = getCartoonAvatarUrl(name);
            document.getElementById('preview-avatar').style.backgroundImage = `url('${url}')`;
        };
        window.updateCartoonAvatar();

        // 10 couleurs distinctes (sans rose, sans bleu)
        const distinctColors = [
            "#22c55e", // Vert vif
            "#eab308", // Jaune / Or
            "#f97316", // Orange chaleureux
            "#a855f7", // Violet profond
            "#14b8a6", // Turquoise / Sarcelle
            "#ef4444", // Rouge flamboyant
            "#84cc16", // Vert lime
            "#f59e0b", // Ambre
            "#d946ef", // Fuchsia vibrant
            "#10b981"  // Émeraude
        ];

        let playerId = localStorage.getItem('blindtest_player_id') || 'player_' + Math.random().toString(36.2).substring(2, 9);
        localStorage.setItem('blindtest_player_id', playerId);

        window.joinGame = async function() {
            playClickSound();
            const nameInput = document.getElementById('player-name-input').value.trim();
            if (!nameInput) {
                showAlertModal("Attention", "Veuillez entrer un pseudo !");
                return;
            }

            const avatarUrl = getCartoonAvatarUrl(nameInput);
            requestWakeLock();

            // Attribue automatiquement une couleur unique selon l'ordre d'arrivée des joueurs
            let assignedColor = distinctColors[0];
            try {
                const snapshot = await get(ref(db, 'players'));
                const playersObj = snapshot.val() || {};
                const playerKeys = Object.keys(playersObj);
                // Si ce joueur n'est pas encore enregistré, son index sera playerKeys.length
                // S'il est déjà enregistré, on garde sa couleur actuelle ou on l'assigne
                if (!playersObj[playerId]) {
                    assignedColor = distinctColors[playerKeys.length % distinctColors.length];
                } else {
                    assignedColor = playersObj[playerId].color || distinctColors[0];
                }
            } catch(e) {
                assignedColor = distinctColors[Math.floor(Math.random() * distinctColors.length)];
            }

            const playerRef = ref(db, 'players/' + playerId);
            set(playerRef, {
                name: nameInput,
                avatar: avatarUrl,
                color: assignedColor,
                score: 0,
                answered: false,
                lastChoice: null,
                lastEarnedPoints: 0
            }).then(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                
                document.getElementById('display-name').textContent = nameInput;
                document.getElementById('display-avatar').style.backgroundImage = `url('${avatarUrl}')`;
                
                const pill = document.getElementById('my-player-pill');
                let glowColor = 'rgba(34, 197, 94, 0.6)';
                if (assignedColor.startsWith('#') && assignedColor.length === 7) {
                    let r = parseInt(assignedColor.slice(1, 3), 16);
                    let g = parseInt(assignedColor.slice(3, 5), 16);
                    let b = parseInt(assignedColor.slice(5, 7), 16);
                    glowColor = `rgba(${r}, ${g}, ${b}, 0.6)`;
                }
                pill.style.setProperty('--player-color', assignedColor);
                pill.style.setProperty('--player-glow', glowColor);

                listenToGameState();
                listenToPersonalScore();
            });
        };

        function listenToPersonalScore() {
            onValue(ref(db, 'players/' + playerId), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('display-score').textContent = `${data.score || 0} pts`;
                }
            });
        }

        function listenToGameState() {
            onValue(ref(db, 'gameState'), (snapshot) => {
                const state = snapshot.val();
                const board = document.getElementById('game-board-content');
                if (!state || state.status !== 'playing') {
                    board.innerHTML = `<div class="waiting-message">En attente du lancement du morceau par la TV...</div>`;
                    return;
                }

                const choiceColors = ["#14b8a6", "#f59e0b", "#84cc16", "#a855f7"];
                let html = `<div class="timer-circle" id="live-timer">${state.timeLeft || 15}</div>`;
                html += `<div class="choices-grid">`;
                state.choices.forEach((choice, index) => {
                    const btnColor = choiceColors[index % choiceColors.length];
                    html += `<button class="choice-btn" id="choice-${index}" style="background-color: ${btnColor};" onclick="makeChoice(${index})">${choice}</button>`;
                });
                html += `</div>`;
                board.innerHTML = html;
            });
        }

        window.makeChoice = function(choiceIndex) {
            playClickSound();
            const buttons = document.querySelectorAll('.choice-btn');
            buttons.forEach(btn => btn.disabled = true);
            const clickedBtn = document.getElementById(`choice-${choiceIndex}`);
            if (clickedBtn) clickedBtn.classList.add('selected');

            update(ref(db, 'players/' + playerId), {
                answered: true,
                lastChoice: choiceIndex
            });
        };
    </script>
</body>
</html>
